<mat-form-field appearance="outline">
  <mat-label>Choisir une vue</mat-label>
  <mat-select [value]="currentView.id" (selectionChange)="changeView($event.value)">
    <mat-option *ngFor="let v of viewOptions" [value]="v.id">
      {{ v.label }} ({{ v.id }})
    </mat-option>
  </mat-select>
</mat-form-field>
