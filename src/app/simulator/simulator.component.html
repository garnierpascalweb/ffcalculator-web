<mat-toolbar color="primary">
  <span>FFCalculator - Vue {{getCurrentViewLabel()}}</span>
  <span class="spacer"></span>
  <!-- Menu dans la barre -->
     <button mat-icon-button  (click)="openAddDialog()" matTooltip="Ajouter un résultat">
    <mat-icon>add_circle</mat-icon>
  </button>
  <app-view-menu></app-view-menu>
</mat-toolbar>

<!-- Tabs -->
<mat-tab-group mat-stretch-tabs>  
  <mat-tab>
    <ng-template mat-tab-label>
      <img src="./assets/icons/list-logo.svg" alt="logo" width="24" height="24">
    </ng-template>
    <ng-container *ngIf="results$ | async as results">
      <app-result-list *ngIf="results" [results]="results"></app-result-list>
    </ng-container>
  </mat-tab>
  <mat-tab>
    <ng-template mat-tab-label>
      <img src="./assets/icons/cup-logo.svg" alt="logo" width="24" height="24">
    </ng-template>
    <app-overview></app-overview>
  </mat-tab>
</mat-tab-group>
