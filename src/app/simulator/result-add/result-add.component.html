<div class="form-container">

  <!-- Lieu de l'épreuve -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-icon matPrefix>place</mat-icon>
    <mat-label>Lieu de l'épreuve</mat-label>
    <input
      type="text"
      matInput
      [formControl]="placeCtrl"
      [matAutocomplete]="autoPlace"
      maxlength="30">
    <mat-autocomplete #autoPlace="matAutocomplete">
      <mat-option *ngFor="let item of filteredPlaces | async" [value]="item">
        {{ item }}
      </mat-option>
    </mat-autocomplete>
    <mat-hint></mat-hint>
  </mat-form-field>


  <!-- Type d'épreuve -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-icon matPrefix>list</mat-icon>
    <mat-label>Type d'épreuve</mat-label>
    <mat-select [formControl]="classCtrl">
      <mat-option *ngFor="let item of classes" [value]="item">
        {{ item }}
      </mat-option>
    </mat-select>
    <mat-hint></mat-hint>
  </mat-form-field>


  <!-- Position obtenue -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-icon matPrefix>flag</mat-icon>
    <mat-label>Place obtenue</mat-label>
    <mat-select [formControl]="posCtrl">
      <mat-option *ngFor="let p of positions" [value]="p">
        {{ p }}
      </mat-option>
    </mat-select>
    <mat-hint></mat-hint>
  </mat-form-field>


  <!-- Nombre de partants -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-icon matPrefix>groups</mat-icon>
    <mat-label>Nombre de partants</mat-label>
    <mat-select [formControl]="prtsCtrl">
      <mat-option *ngFor="let n of partants" [value]="n">
        {{ n }}
      </mat-option>
    </mat-select>
    <mat-hint></mat-hint>
  </mat-form-field>

  <div class="button-container">
    <button mat-raised-button color="primary">
      Ajouter résultat
    </button>
  </div>

</div>
