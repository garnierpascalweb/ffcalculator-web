<div class="card-container">
  <div class="result-card" [class.disabled]="!isTop15">
    <!-- Image -->
    <div class="avatar">
      <img src="{{getAvatarUrl()}}" alt="avatar" />
    </div>

    <!-- Contenu central -->
    <div class="content">
      <div class="title">{{ result.place }}</div>
      <div class="subtitle">{{ getResultSubtitle() | async }}</div>
      <div class="subtitle">{{ 'RESULT_DETAILS.CARD.LABEL' | translate:{ pos: result.pos, prts: result.prts } }}</div>
    </div>

    <!-- Partie droite -->
    <div class="actions">
      <div class="label"> {{ result.pts }}</div>
      <div class="icons">
        <button mat-icon-button class="icon-btn" (click)="onHelpResult(result)">
          <mat-icon>help_outline</mat-icon>
        </button>
        <button mat-icon-button class="icon-btn" (click)="onDeleteResult(result)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>
  </div>
</div>
