<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Définir un clip pour limiter les bandes au cercle -->
  <defs>
    <clipPath id="circleClip">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>

  <!-- Trois bandes verticales -->
  <g clip-path="url(#circleClip)">
    <rect x="0" y="0" width="66.66" height="200" fill="#0055A4"/>   <!-- bleu -->
    <rect x="66.66" y="0" width="66.66" height="200" fill="#FFFFFF"/> <!-- blanc -->
    <rect x="133.33" y="0" width="66.67" height="200" fill="#EF4135"/> <!-- rouge -->
  </g>

  <!-- Texte centré horizontalement et verticalement -->
  <text x="100" y="100"
        font-size="28"
        font-weight="bold"
        font-family="Rubik, sans-serif"
        text-anchor="middle"
        dominant-baseline="middle"
        fill="#000000">
    <tspan x="100" dy="-18">CHF</tspan>
    <tspan x="100" dy="36">U17</tspan>
  </text>
</svg>
